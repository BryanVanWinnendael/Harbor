name: Harbor Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ ! -f .version ]; then
            echo "0.0.0" > .version
          fi

          PREVIOUS_VERSION=$(tr -d '[:space:]' < .version)

          if ! [[ "$PREVIOUS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $PREVIOUS_VERSION"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$PREVIOUS_VERSION"

          case "${{ inputs.version_bump }}" in
            major)
              VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
            *)
              echo "Invalid version bump"
              exit 1
              ;;
          esac

          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Previous version: $PREVIOUS_VERSION"
          echo "New version: $VERSION"

          if [ "$VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "VERSION_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "$VERSION" > .version
            echo "VERSION_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Set lowercase owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${OWNER_LC}/harbor" >> "$GITHUB_ENV"

      - name: Check if version already exists
        id: check
        run: |
          IMAGE_VERSION="${IMAGE}:${VERSION}"

          echo "Checking $IMAGE_VERSION"

          if docker manifest inspect "$IMAGE_VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: $IMAGE_VERSION"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist: $IMAGE_VERSION"
          fi

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/harbor:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/harbor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit updated version
        if: env.VERSION_CHANGED == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .version

          git commit \
            -m "[Harbor Release]: bump version to ${VERSION}"

          git pull --rebase origin "${{ github.ref_name }}"

          git push

      - name: Create Git tag
        if: env.VERSION_CHANGED == 'true'
        shell: bash
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Summary
        run: |
          echo "## Harbor Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Previous version:** ${PREVIOUS_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bump:** ${{ inputs.version_bump }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ghcr.io/${OWNER_LC}/harbor:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
